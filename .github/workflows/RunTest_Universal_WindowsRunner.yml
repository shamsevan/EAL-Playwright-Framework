name: EAL Universal Test Runner

# =====================================================================
# (English) This workflow allows manual execution of Playwright tests.
# You can pass URL/User/Pass manually, or let it use default GitHub Secrets.
# (Bangla) Ei workflow ti manual test run korar jonno. Apni chaile URL 
# ba Password nije type kore dite paren, othoba default secrets theke nibe.
# =====================================================================

on: 
  workflow_dispatch: 
    inputs: 
      # =====================================================================
      # (English) Input for Portal URL. Defaults to empty string if not provided.
      # (Bangla) Portal URL er jonne input. Kichu na dile khali string nibe.
      # =====================================================================
      url: 
        description: 'Portal URL (Blank = use .env default)' 
        required: false 
        default: '' 
        type: string 

      # =====================================================================
      # (English) Input for Username. Defaults to empty string if not provided.
      # (Bangla) Username er jonne input. Kichu na dile khali string nibe.
      # =====================================================================
      userid: 
        description: 'Username (Blank = use .env default)' 
        required: false 
        default: '' 
        type: string 

      # =====================================================================
      # (English) Input for Password. Will fetch from GitHub secrets if left blank.
      # (Bangla) Password er jonne input. Faka rakhle GitHub secret theke nibe.
      # =====================================================================
      password: 
        description: 'Password (Blank = use GitHub Secret)' 
        required: false 
        type: string 

      # =====================================================================
      # (English) Dropdown to select the test controller file.
      # (Bangla) Test controller file select korar jonne dropdown.
      # =====================================================================
      test_controller: 
        description: 'Select Test Controller to run' 
        required: true 
        default: SmokeTestController.csv 
        type: choice 
        options: 
          - SmokeTestController.csv 
          - RegressionTestController.csv 

jobs: 
  execute-tests: 
    runs-on: windows-latest 
    timeout-minutes: 60
    
    # =====================================================================
    # (Pro-Grade) Dynamically loads secrets based on the current Branch Name
    # (Bangla) Current Branch er nam onujayi automatically secret load korbe.
    # =====================================================================
    environment: ${{ github.ref_name }}

    steps: 
      # =====================================================================
      # 1. (English) Check out the repository code.
      #    (Bangla) GitHub theke apnar code runner-e download korbe.
      # =====================================================================
      - name: Checkout code 
        uses: actions/checkout@v4 

      # =====================================================================
      # 2. (English) Setup Node.js environment using npm caching.
      #    (Bangla) Test run korar jonno Node.js install korbe ebong cache korbe.
      # =====================================================================
      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # =====================================================================
      # 3. (English) Install dependencies and Playwright Chromium browser.
      #    (Bangla) npm packages ebong Chromium browser install korbe.
      # =====================================================================
      - name: Install dependencies & Playwright
        shell: powershell
        run: | 
          npm install 
          npx playwright install chromium --with-deps

      # =====================================================================
      # 4. (English) Resolve Credentials & Run Tests via Controller.
      #    (Bangla) Input/Secret theke data niye Playwright test run korbe.
      # =====================================================================
      - name: Run Playwright tests with selected controller 
        shell: powershell 
        env: 
          # =====================================================================
          # (English) Fetches password from GitHub Environment Secrets.
          # (Bangla) GitHub Environment Secrets theke password fetch korbe.
          # =====================================================================
          SECRET_PASSWORD: ${{ secrets.USER_PORTAL_PASSWORD }} 
        run: | 
          # Step A: Resolve URL
          $resolvedUrl = "${{ github.event.inputs.url }}"
          if ([string]::IsNullOrWhiteSpace($resolvedUrl)) { $resolvedUrl = "https://parabank.parasoft.com/parabank/index.htm" }

          # Step B: Resolve Username
          $resolvedUser = "${{ github.event.inputs.userid }}"
          if ([string]::IsNullOrWhiteSpace($resolvedUser)) { $resolvedUser = "john" }

          # Step C: Resolve Password
          $resolvedPassword = "${{ github.event.inputs.password }}"
          if ([string]::IsNullOrWhiteSpace($resolvedPassword)) { $resolvedPassword = $env:SECRET_PASSWORD }

          # Exporting to Runner Environment
          "USER_PORTAL_URL=$resolvedUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append 
          "USER_PORTAL_USERNAME=$resolvedUser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append 
          "USER_PORTAL_PASSWORD=$resolvedPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append 
          
          # Run the selected controller
          $controller = "${{ github.event.inputs.test_controller }}"
          Write-Host "Running tests using: $controller"
          "TEST_CONTROLLER=$controller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append 
          
          npm test $controller

     # =====================================================================
      # 5. (English) Upload Playwright HTML Report.
      #    (Bangla) Playwright report ti GitHub artifact hisebe upload korbe.
      # =====================================================================
      - name: Upload Playwright HTML report 
        uses: actions/upload-artifact@v4 
        if: ${{ always() }} 
        with: 
          name: playwright-report-${{ github.ref_name }}
          path: apps/playwright-report/ 
          retention-days: 15

      # =====================================================================
      # 6. (English) Upload AllTestResults Directory.
      #    (Bangla) AllTestResults folder ti GitHub artifact hisebe upload korbe.
      # =====================================================================
      - name: Upload All Test Results
        uses: actions/upload-artifact@v4 
        if: ${{ always() }} 
        with: 
          name: AllTestResults-${{ github.ref_name }}
          path: AllTestResults/ 
          retention-days: 15